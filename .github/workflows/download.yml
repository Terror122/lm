name: Download curriculum uploads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        year: ["2022", "2023", "2024", "2025", "2026"]
    steps:
      - name: Download files
        run: |
          wget -r -np -nH --cut-dirs=2 -nv \
            -e robots=off \
            -A pdf,doc,docx,ppt,pptx,xls,xlsx,zip \
            -R "index.html*" \
            https://curriculumresources.edu.gh/wp-content/uploads/${{ matrix.year }}/
          du -sh ${{ matrix.year }} || true

      - name: Zip
        run: zip -r -0 "uploads_${{ matrix.year }}.zip" "${{ matrix.year }}"

      - uses: actions/upload-artifact@v4
        with:
          name: uploads-${{ matrix.year }}
          path: "*.zip"

  release:
    needs: download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: uploads-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "uploads-$(date +%Y%m%d)" *.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Curriculum uploads $(date +%Y-%m-%d)"
